# The static site on GitHub Pages: this repository's pages and engine + the generated data of one release.
#
# The repository holds source only. Everything generated (the baked town, the gallery's pictures, the one-file
# .glb towns, the gallery's frozen data) is the assets of one release, written on the authoring machine in parts
# named by their content, so that only what changed is uploaded:
#
#     python3 tools/site.py --upload data        # writes out/site-data/ and brings the release `data` up to date
#
# Once: Settings > Pages > Source: GitHub Actions. Then run this workflow from the Actions tab (or it runs by itself
# after a push to main). After a new bake: --upload again, then run it again.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data_tag:
        description: Release that holds the site data (empty - the DATA_TAG of the workflow file)
        required: false

env:
  DATA_TAG: data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: three.js (the pages import it from node_modules/)
        run: npm ci --omit=dev
      - name: Generated data
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.data_tag || env.DATA_TAG }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir site-data
      - name: Assemble
        run: python3 tools/site.py --out _site --data site-data --copy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
