<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe test: Blender-baked light probes in three.js</title>
<style>
html, body { margin: 0; height: 100%; background: #05060a; color: #d8cfc0; font: 12px/1.45 ui-monospace, monospace; overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; left: 10px; top: 8px; white-space: pre; text-shadow: 0 1px 2px #000; pointer-events: none; }
#nav { position: fixed; right: 10px; top: 8px; display: flex; gap: 6px; }
#nav a { color: #ffdca8; background: #0009; border: 1px solid #ffffff2a; border-radius: 6px; padding: 4px 8px; text-decoration: none; }
.still #nav { display: none; }
</style>
<script type="importmap">
{ "imports": {
	"three": "../node_modules/three/build/three.webgpu.js",
	"three/webgpu": "../node_modules/three/build/three.webgpu.js",
	"three/tsl": "../node_modules/three/build/three.tsl.js",
	"three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">loading…</div>
<div id="nav"></div>
<script>
window.__log = [];
for ( const k of [ 'error', 'warn' ] ) { const o = console[ k ].bind( console ); console[ k ] = ( ...a ) => { window.__log.push( k + ': ' + a.map( ( x ) => ( x && x.stack ) ? x.stack : String( x ) ).join( ' ' ) ); o( ...a ); }; }
window.addEventListener( 'error', ( e ) => window.__log.push( 'onerror: ' + e.message + ' ' + e.filename + ':' + e.lineno ) );
window.addEventListener( 'unhandledrejection', ( e ) => window.__log.push( 'rejection: ' + ( e.reason && e.reason.stack || e.reason ) ) );
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
