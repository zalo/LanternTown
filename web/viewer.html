<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lantern Square &middot; asset viewer</title>
<style>
html, body { margin: 0; height: 100%; background: #05060a; color: #d8cfc0; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; left: 10px; right: 10px; top: 8px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#ui button, #ui select { font: inherit; font-size: 12px; background: #0009; color: #d8cfc0; border: 1px solid #ffffff2a; border-radius: 6px; padding: 5px 9px; }
#ui b { font-weight: 600; color: #ffcf8a; margin-right: 4px; text-shadow: 0 1px 2px #000; }
#info { position: fixed; left: 10px; bottom: 10px; z-index: 3; font: 11px/1.5 ui-monospace, monospace; opacity: .75; white-space: pre-wrap; pointer-events: none; text-shadow: 0 1px 2px #000; max-width: 92vw; }
</style>
<script type="importmap">
{ "imports": {
	"three": "./node_modules/three/build/three.webgpu.js",
	"three/webgpu": "./node_modules/three/build/three.webgpu.js",
	"three/tsl": "./node_modules/three/build/three.tsl.js",
	"three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
	<b id="name">loading&hellip;</b>
	<select id="variant" title="variant (seed + params)"></select>
	<select id="rig" title="lighting"><option value="night">Night</option><option value="studio">Studio</option></select>
	<a href="gallery/"><button>Gallery</button></a>
</div>
<div id="info"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
